name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller
        run: pip install pyinstaller

      - name: Générer le .exe
        run: pyinstaller --onefile --windowed --name SimulateurPrimeLanala main.py

      - uses: actions/upload-artifact@v4
        with:
          name: SimulateurPrimeLanala-Windows
          path: dist/SimulateurPrimeLanala.exe
